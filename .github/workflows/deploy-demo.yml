name: Publicera demo på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera paket
        run: |
          npm install --no-audit --no-fund --prefix src/register-admin
          npm install --no-audit --no-fund --prefix src/register-public

      - name: Typkontroll (varnar bara)
        continue-on-error: true
        run: |
          (cd src/register-admin && npx tsc -b)
          (cd src/register-public && npx tsc -b)

      - name: Bygg administration
        working-directory: src/register-admin
        run: npx vite build --base ./ --outDir ../../site/admin --emptyOutDir

      - name: Bygg registrering och kiosk
        working-directory: src/register-public
        run: npx vite build --base ./ --outDir ../../site/registrering --emptyOutDir

      - name: Lägg till startsidan
        run: |
          cp demo-site/* site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
